name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Assert dependency-free package
        run: |
          node -e 'const p=require("./package.json"); for (const key of ["dependencies","devDependencies","optionalDependencies","peerDependencies"]) if (p[key] && Object.keys(p[key]).length) throw new Error(key + " must stay empty")'
      - name: Install pinned OMP test runtime
        run: npm install --global @oh-my-pi/pi-coding-agent@17.2.11
      - name: Run tests
        run: npm test

  model-drift:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Compare committed catalog to Command Code
        run: npm run models:check
